<section id="skills" class="skills">
  <div class="container">
    <div appReveal class="skills-header">
      <h2>KI-Kompetenzen</h2>
      <p class="skills-subtitle">10 Kernbereiche — von der Idee bis zur produktionsreifen KI-Lösung</p>
    </div>

    <div class="skills-grid">
      <div
        *ngFor="let skill of skills; let i = index"
        class="skill-card"
        appReveal
        [revealDelay]="i * 80"
      >
        <div class="skill-icon">
          <lucide-icon [img]="skill.icon" [size]="32" strokeWidth="1.5"></lucide-icon>
        </div>
        <h3>{{ skill.title }}</h3>
        <div class="skill-technologies">
          <span *ngFor="let tech of skill.technologies" class="badge">
            {{ tech }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
