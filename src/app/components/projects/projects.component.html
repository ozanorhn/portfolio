<section id="projects" class="projects">
  <div class="container">
    <div appReveal class="projects-header">
      <h2>Projekte</h2>
      <p class="projects-subtitle">KI-Systeme, Automationen und Open-Source-Arbeiten</p>
    </div>

    <div class="projects-section-label" appReveal>
      <span class="section-divider-label">KI Case Studies</span>
    </div>

    <div class="projects-list">
      <app-project-card
        *ngFor="let project of aiProjects; let i = index"
        [project]="project"
        appReveal
        [revealDelay]="i * 150"
      ></app-project-card>
    </div>

    <div class="projects-section-label" appReveal>
      <span class="section-divider-label section-divider-label--secondary">Open Source</span>
    </div>

    <div class="projects-list">
      <app-project-card
        *ngFor="let project of openSourceProjects; let i = index"
        [project]="project"
        appReveal
        [revealDelay]="i * 150"
      ></app-project-card>
    </div>
  </div>
</section>
