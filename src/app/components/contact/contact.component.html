<section id="contact" class="contact">
  <div class="contact-gradient"></div>

  <div class="container">
    <div appReveal class="contact-header">
      <h2>Kontakt aufnehmen</h2>
      <p>Lass mich hören, wenn du ein Projekt starten oder zusammenarbeiten möchtest.</p>
    </div>

    <div class="contact-grid">
      <a
        *ngFor="let contact of contactMethods; let i = index"
        [href]="contact.url"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-card"
        appReveal
        [revealDelay]="i * 150"
      >
        <div class="contact-icon">
          <lucide-icon [img]="contact.icon" [size]="28" strokeWidth="1.5"></lucide-icon>
        </div>
        <h3>{{ contact.label }}</h3>
        <p>{{ contact.value }}</p>
        <span class="contact-arrow">→</span>
      </a>
    </div>
  </div>
</section>
