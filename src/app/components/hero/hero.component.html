<section id="home" class="hero">
  <div class="hero-background">
    <div class="gradient-blob"></div>
  </div>

  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title">Ozan Orhan</h1>
      <h2 class="hero-subtitle">
        <span class="subtitle-line">Frontend Entwickler</span>
        <span class="subtitle-line">AI & Automation</span>
      </h2>
      <p class="hero-description">
        Ich entwickle moderne Webanwendungen, AI-gestützte Tools und automatisierte Systeme,
        die komplexe Prozesse vereinfachen.
      </p>

      <div class="hero-buttons">
        <button class="btn btn-primary btn-lg" (click)="scrollToSection('projects')">

        <button class="btn btn-secondary btn-lg" (click)="scrollToSection('contact')">

  <div class="scroll-indicator">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>
