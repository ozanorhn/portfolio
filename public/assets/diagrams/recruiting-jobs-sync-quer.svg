<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="sbt sbd" preserveAspectRatio="xMidYMid meet">
<title id="sbt">Systembild Recruiting Jobs Sync</title>
<desc id="sbd">Täglicher Batch. Ein Lauf-Zeitstempel wird zu Beginn gesetzt und über den gesamten Lauf geführt. Karriereseite, Scraping und Extraktion, LLM-gestützte strukturierte Extraktion, Validierung und Normalisierung, Upsert in den Datenspeicher; die Schleife läuft je Link mit Batchgröße eins. Jeder berührte Datensatz bekommt last_seen_at auf den Laufzeitpunkt. Am Ende werden alle aktiven Zeilen mit älterem last_seen_at auf inaktiv gesetzt statt gelöscht.</desc>
