<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="sbt sbd" preserveAspectRatio="xMidYMid meet">
<title id="sbt">Systembild Wissensbasis — RAG-Pipeline und MCP-Server</title>
<desc id="sbd">Zwei getrennte Workflows teilen sich einen Vector Store. Schreibpfad: Dokumentquelle, Ingest als manuell ausgelöster Batch, Chunking, mehrsprachige Embeddings. Gemeinsamer Vector Store auf Postgres mit Vektor-Erweiterung und dedizierter Match-Funktion. Lesepfad: Retrieval, MCP-Server mit einem nur lesenden Tool, beliebige MCP-Clients als Consumer. Die Anfrage läuft gegenläufig zum Treffer.</desc>
