<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" role="img" aria-labelledby="sbt sbd" preserveAspectRatio="xMidYMid meet">
<title id="sbt">Systembild Grounding Page Generator</title>
<desc id="sbd">Dreistufiger Self-Service-Flow. Stufe eins: Formular, Verzweigung nach vorhandener URL, Research-Agent mit Web-Such-Tool und JSON-Schema, Session als Audit-Trail. Stufe zwei: Validierung durch den Menschen zwischen den beiden Modellaufrufen, danach deterministisches Merge, bei dem die Nutzereingabe die KI schlägt, wenn sie vorhanden ist. Stufe drei: Generierungs-Chain gegen ein strenges Ausgabeschema und das fertige Dokument aus Titel, Meta-Description, JSON-LD und HTML.</desc>
